# /etc/dracut.conf.d/bcm-bt-firmware.conf — патч прошивки Broadcom BCM20702 в initramfs.
# btusb прописан в /etc/modules-load.d/btusb.conf (install-bluetooth.sh) и грузится ещё из
# initramfs, а dracut не знает, что btusb нужен этот .hcd. Без файла в initramfs чип остаётся
# на ROM-прошивке («build 0000») и наушники подключаются/отключаются по кругу.
# Страховка, если файл всё же не попал: bcm-bt-firmware-guard.service.
install_items+=" /usr/lib/firmware/brcm/BCM20702A1-13d3-3404.hcd "
