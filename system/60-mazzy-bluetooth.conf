# /etc/bluetooth/main.conf.d/ — автовключение адаптера и автоподключение наушников.
# Реконнект — задача самих наушников + этой политики: ноутбук не пейджит спаренные устройства по таймеру
# (см. спеку bt-audio, mazzy-bt-audio.service).
[General]
FastConnectable=true
[Policy]
AutoEnable=true
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64
# Профили, которые BlueZ восстанавливает после разрыва линка: HSP HS, HFP HF, A2DP Source, A2DP Sink
ReconnectUUIDs=00001112-0000-1000-8000-00805f9b34fb,0000111f-0000-1000-8000-00805f9b34fb,0000110a-0000-1000-8000-00805f9b34fb,0000110b-0000-1000-8000-00805f9b34fb
