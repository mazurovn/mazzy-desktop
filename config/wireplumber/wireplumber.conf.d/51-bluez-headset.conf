# Bluetooth-аудио для ЛЮБЫХ наушников (см. MAZZY_VO/system/README.md).
#  - A2DP (стерео) и HFP/HSP (гарнитура с микрофоном) — оба профиля доступны для каждого устройства
#  - автопереключение: приложение открывает микрофон → профиль гарнитуры, закрыло → обратно в стерео
#
# ВАЖНО: не добавлять сюда bluez5.codecs / bluez5.enable-msbc / bluez5.enable-hw-volume —
# с ними монитор BlueZ не стартует и наушники вообще пропадают из PipeWire (проверено 2026-09-22).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag hsp_hs hsp_ag ]
  bluez5.hfphsp-backend = "native"
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
