# MAZZY_VO — сессия «Mazzy» в меню входа GDM.
# Dux — отдельная сессия на Sway, этот конфиг она не читает.
# Собрано из частей; правь conf/*.conf, этот файл только подключает их.

source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/look.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/rules.conf
source = ~/.config/hypr/conf/binds.conf
source = ~/.config/hypr/conf/theme.conf
source = ~/.config/hypr/conf/plugins.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/mazzy-effects.conf   # генерирует MAZZY Environment, поверх look.conf
