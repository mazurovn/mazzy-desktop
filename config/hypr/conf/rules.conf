# Слои Noctalia: блюр под баром/доком/панелями, без анимации от Hyprland (у Noctalia своя)
layerrule {
    name = noctalia
    match:namespace = ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
    no_anim = true
    ignore_alpha = 0.5
    blur = true
    blur_popups = true
}

# Свой бар и док. Непрозрачные, без анимации Hyprland.
layerrule {
    name = mazzy-chrome
    match:namespace = ^mazzy-(bar|dock)$
    no_anim = true
}

# Свой 3D-переключатель окон: блюр под каруселью
layerrule {
    name = mazzy-switcher
    match:namespace = ^mazzy-switcher$
    no_anim = true
    blur = true
    ignore_alpha = 0.3
}

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Окно настроек Noctalia и системные настройки — плавающие по центру
windowrule {
    name = float-settings
    match:class = ^(dev.noctalia.Noctalia|org.gnome.Settings|gnome-control-center|qt6ct)$
    float = true
    center = true
    size = 1100 720
}

# Cursor 3.21 в glass/Agents на Hyprland рисует пустое окно и сжимается в узкую плитку
windowrule {
    name = cursor-float
    match:class = ^(cursor|Cursor)$
    float = true
    center = true
    size = 1400 900
}

# Плавающие утилиты
windowrule {
    name = float-utils
    match:class = ^(org.gnome.Calculator|pavucontrol|nm-connection-editor|blueman-manager|xdg-desktop-portal-gtk|org.pulseaudio.pavucontrol)$
    float = true
    center = true
    size = 40% 50%
}

windowrule {
    name = float-dialogs
    match:title = ^(Open File|Save File|Open Folder|Choose Files|Выберите файл|Открыть|Сохранить как)$
    float = true
    center = true
    size = 60% 60%
}

# Zoom: всё плавающее, кроме окна конференции
windowrule {
    name = zoom-float
    match:class = ^(zoom)$
    float = true
}
windowrule {
    name = zoom-meeting-tile
    match:class = ^(zoom)$
    match:title = ^(Zoom Meeting|Zoom Workplace).*
    float = false
}

# Терминал и медиаплееры чуть прозрачные, видео — непрозрачное
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.92 0.88
}
windowrule {
    name = opaque-video
    match:class = ^(firefox|mpv|vlc|zoom)$
    match:fullscreen = true
    opacity = 1.0 1.0
}

# Picture-in-Picture Firefox
windowrule {
    name = firefox-pip
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
    size = 30% 30%
    move = 68% 66%
}
