exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# Оболочка — mazzy-shell (Nim). Noctalia не стартует.
# EGL только через Mesa у самого шелла: глобальный фильтр ломает PRIME-offload.
# Сессия Mazzy. Dux сюда не входит: он запускается на Sway.
exec-once = /usr/libexec/hyprpolkitagent
exec-once = mako
exec-once = env __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json ~/.local/bin/mazzy-shell
# Штатные апплеты сети и Bluetooth в трее: подключение мышью без терминала
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
