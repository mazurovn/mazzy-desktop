# Super = ⌘. Раскладка близка к macOS, но без конфликтов с приложениями.
# Оболочка — mazzy-shell. Вызовов noctalia здесь нет.
$mod = SUPER
$term = kitty
$files = nautilus
$browser = firefox

# --- Приложения ---
bind = $mod, Return, exec, $term
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser
# Win+Space меняет раскладку через xkb (input.conf: grp:win_space_toggle).
bind = ALT, Space, exec, fuzzel
bind = $mod, S, exec, ~/.local/bin/mazzy-settings
bind = $mod, N, exec, makoctl restore
bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod, code:60, exec, fuzzel
bind = $mod, code:59, exec, ~/.local/bin/mazzy-settings
bind = $mod SHIFT, code:59, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = $mod ALT, code:59, exec, ~/.local/bin/mazzy-settings
bind = $mod, W, exec, ~/.local/bin/mazzy-ctl wallpaper next
bind = $mod, L, exec, swaylock -f -i ~/Pictures/Wallpapers/mazzy-09-lab.jpg
bind = $mod SHIFT, Q, exec, ~/.local/bin/mazzy-ctl session
bind = $mod, D, exec, ~/.local/bin/mazzy-ctl wallpaper dock
bind = $mod, Tab, exec, ~/.local/bin/mazzy-ctl switcher next
bind = $mod SHIFT, Tab, exec, ~/.local/bin/mazzy-ctl switcher prev
bind = ALT, Tab, exec, ~/.local/bin/mazzy-ctl switcher next
bind = ALT SHIFT, Tab, exec, ~/.local/bin/mazzy-ctl switcher prev

# --- Окна ---
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, togglefloating
bind = $mod, M, fullscreen, 1
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, H, movetoworkspacesilent, special:hidden
bind = $mod SHIFT, H, togglespecialworkspace, hidden

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod ALT, up,   movefocus, u
bind = $mod ALT, down, movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Рабочие столы ---
bind = CTRL, left,  workspace, e-1
bind = CTRL, right, workspace, e+1
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod, code:49, togglespecialworkspace, scratch
bind = $mod SHIFT, code:49, movetoworkspace, special:scratch

# --- Скриншоты. Не на Shift+цифре: эти клавиши уносят окно на стол. ---
bind = $mod, Print, exec, grim - | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# --- Мультимедиа ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -d intel_backlight set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -d intel_backlight set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# --- Служебное ---
bind = $mod SHIFT, R, exec, ~/.local/bin/mazzy-ctl wallpaper reload
