input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle,caps:escape_shifted_capslock
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true

    touchpad {
        natural_scroll = true      # как на Mac
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.6
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace
gesture = 4, up, special, hidden   # 4 пальца вверх — скрытый стол. Обзор hyprexpo выключен.

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Приложение с уведомлением не забирает стол. Фокус остаётся там, где человек работает.
    focus_on_activate = false
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}




