# Внешний вид в духе macOS: воздух, скругления, мягкие тени, лёгкий блюр.
# Блюр специально лёгкий — Intel HD 4600 (Haswell).

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(ffffff33)
    col.inactive_border = rgba(ffffff12)
    resize_on_border = true
    extend_border_grab_area = 12
    allow_tearing = false
    # Лента на 0.56.2: layout = scrolling. Строка general.layout её не включает.
    # Пока процесс сессии 0.53, значение dwindle: ⌘⇧R делает hyprctl reload.
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2.5
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.06

    shadow {
        enabled = true
        range = 12
        render_power = 2
        offset = 0 4
        color = rgba(00000055)
        color_inactive = rgba(0000002e)
    }

    blur {
        enabled = true
        size = 2
        passes = 1
        vibrancy = 0
        noise = 0
        brightness = 1.0
        contrast = 1.0
        popups = true
        popups_ignorealpha = 0.5
        ignore_opacity = true
        new_optimizations = true
        xray = false
    }
}

dwindle {
    preserve_split = true
    force_split = 2
    smart_split = false
}

master {
    new_status = master
}
