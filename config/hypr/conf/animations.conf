# Плавные «маковские» кривые: быстрый разгон, мягкое торможение
animations {
    enabled = true

    bezier = easeOutExpo,   0.16, 1,    0.3,  1
    bezier = easeOutQuint,  0.23, 1,    0.32, 1
    bezier = easeInOutCubic,0.65, 0.05, 0.36, 1
    bezier = overshot,      0.05, 0.9,  0.1,  1.05
    bezier = linear,        0,    0,    1,    1

    animation = global,        1, 10,   default
    animation = windowsIn,     1, 4,    easeOutExpo, popin 85%
    animation = windowsOut,    1, 3,    easeInOutCubic, popin 85%
    animation = windowsMove,   1, 4,    easeOutQuint
    animation = border,        1, 6,    easeOutQuint
    animation = fadeIn,        1, 3,    easeOutQuint
    animation = fadeOut,       1, 3,    easeInOutCubic
    animation = fadeDim,       1, 4,    easeOutQuint
    animation = layersIn,      1, 3,    easeOutExpo, fade
    animation = layersOut,     1, 2,    easeInOutCubic, fade
    animation = workspacesIn,  1, 4,    easeOutExpo, slidefade 15%
    animation = workspacesOut, 1, 4,    easeInOutCubic, slidefade 15%
    animation = specialWorkspaceIn,  1, 4, overshot, slidevert
    animation = specialWorkspaceOut, 1, 3, easeInOutCubic, slidevert
}
